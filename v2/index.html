  --blue:#0081cc; --blue-2:#2ea2ea; --ice:#6fd0ff; --white:#fff; --gray:#dadada;
  --bg:#03080f; --muted:#9db6c9;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-head:"Montserrat","Inter",system-ui,sans-serif;
  --px:0; --py:0; --tilt:1;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100svh;background:var(--bg);color:var(--white);font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
ul{margin:0;padding:0;list-style:none}
p{margin:0}
button{font:inherit}
:focus-visible{outline:2px solid var(--ice);outline-offset:3px}

/* ---------- Background stack ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#0b3d63 0%,#06182a 45%,#03080f 82%)}
.video-bg{position:absolute;inset:0;overflow:hidden}
.video-bg iframe{position:absolute;top:50%;left:50%;width:max(100vw,177.78svh);height:max(56.25vw,100svh);transform:translate(-50%,-50%) scale(1.2);border:0;pointer-events:none;opacity:0;transition:opacity .15s ease}
.video-bg.ready iframe{opacity:1;transition:opacity 1.4s ease}
.grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,110,185,.08) 0%,rgba(3,8,15,0) 45%,rgba(3,8,15,.6) 100%)}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(3,8,15,0) 50%,rgba(3,8,15,.42) 100%)}
.spot{position:absolute;inset:0;mix-blend-mode:screen;background:radial-gradient(540px circle at calc((var(--px) + 1) * 50%) calc((var(--py) + 1) * 50%),rgba(76,195,255,.07),transparent 62%)}
#fx{position:absolute;inset:0;width:100%;height:100%}

/* ---------- Floating glass nav ---------- */
.nav{position:fixed;top:max(16px,env(safe-area-inset-top));left:0;right:0;margin-inline:auto;z-index:20;width:min(860px,calc(100% - 28px));display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 18px;border-radius:999px;background:rgba(6,16,28,.55);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);animation:drop .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:none}}
.brand{display:inline-flex;align-items:center;gap:12px}
.logo{position:relative;display:block;width:46px;height:25px;background:var(--logo) center/contain no-repeat}
.brand-text{font:800 .92rem/1 var(--font-head);letter-spacing:.16em}
.menu{display:flex;align-items:center;gap:6px}
.link{position:relative;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-size:.92rem;font-weight:500;color:var(--gray);transition:color .2s,background .2s,transform .2s,box-shadow .2s}
.link:hover{color:#fff;background:rgba(255,255,255,.07)}
.link.active{color:#fff}
.link.active::after{content:"";position:absolute;left:50%;bottom:3px;width:16px;height:2px;margin-left:-8px;border-radius:2px;background:var(--ice);box-shadow:0 0 10px var(--ice)}
.link-discord{color:#fff;font-weight:600;background:linear-gradient(180deg,#22a6f2,#0081cc);box-shadow:0 6px 22px rgba(0,129,204,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.link-discord:hover{background:linear-gradient(180deg,#45b6f7,#0a8ee0);transform:translateY(-1px);box-shadow:0 10px 28px rgba(0,129,204,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.dc{display:inline-block;width:20px;height:15px;flex:none;background:#fff;-webkit-mask:var(--dc) center/contain no-repeat;mask:var(--dc) center/contain no-repeat}

/* ---------- Extras: pixel trail, time-of-day tint ---------- */
.tod{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 2s}
.trail{position:fixed;left:0;top:0;z-index:60;pointer-events:none;width:8px;height:8px;margin:-4px 0 0 -4px;background:#6fd0ff;box-shadow:0 0 10px #2ea2ea;opacity:0;will-change:transform,opacity}

/* ---------- Hero ---------- */
.hero{position:relative;z-index:10;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:92px 18px 26px}
.center{flex:1;width:100%;display:flex;align-items:center;justify-content:center;perspective:1100px;animation:rise 1s cubic-bezier(.2,.8,.2,1) .15s both}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
.ip-card{position:relative;border-radius:26px;transform:rotateY(calc(var(--px) * 7deg * var(--tilt))) rotateX(calc(var(--py) * -6deg * var(--tilt)));will-change:transform}
.glow,.ring{position:absolute;border-radius:inherit;pointer-events:none}
.glow{inset:-10px;background:conic-gradient(from var(--a),transparent 0 48%,rgba(46,162,234,.9) 76%,rgba(255,255,255,.95) 90%,transparent);filter:blur(24px);opacity:.55;animation:spin 6s linear infinite}
.ring{inset:-1.5px;padding:1.5px;background:conic-gradient(from var(--a),rgba(255,255,255,.12) 0 45%,var(--blue-2) 75%,#fff 90%,rgba(255,255,255,.12));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;animation:spin 6s linear infinite}
@keyframes spin{to{--a:360deg}}
.ip-inner{position:relative;display:flex;align-items:center;gap:24px;padding:14px 14px 14px 34px;border-radius:inherit;background:linear-gradient(180deg,rgba(10,26,44,.58),rgba(4,12,22,.66));backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.5)}
.ip-inner::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(280px circle at calc((var(--px) + 1) * 50%) calc((var(--py) + 1) * 50%),rgba(255,255,255,.10),transparent 62%)}
.ip-value{position:relative;display:inline-flex;align-items:center;font:800 clamp(1.55rem,3.7vw,2.5rem)/1 var(--font-head);letter-spacing:.01em;cursor:pointer;text-shadow:0 2px 16px rgba(0,0,0,.6),0 0 30px rgba(76,195,255,.35);user-select:all}
.copy{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:19px 28px;border:0;border-radius:18px;font-weight:700;font-size:1rem;line-height:1;letter-spacing:.02em;color:#fff;cursor:pointer;background:linear-gradient(180deg,#22a6f2,#0081cc);box-shadow:0 10px 30px rgba(0,129,204,.5),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,60,110,.45);transition:transform .15s,box-shadow .25s,background .15s,color .05s}
.copy::before{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);transition:left .7s}
.copy:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(0,129,204,.65),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,60,110,.45)}
.copy:hover::before{left:130%}
.copy:active{transform:translateY(1px) scale(.98)}
.copy svg{position:relative;width:20px;height:20px;flex:none}
.copy span{position:relative;min-width:5.3em;text-align:left}
.copy .ic-check{display:none}
.copy.done{background:linear-gradient(180deg,#fff,#d4eeff);color:#06304d;box-shadow:0 10px 34px rgba(111,208,255,.55),inset 0 -3px 0 rgba(120,185,230,.6)}
.copy.done .ic-copy{display:none}
.copy.done .ic-check{display:block}
.px{position:fixed;left:0;top:0;z-index:60;pointer-events:none;will-change:transform,opacity}

/* ---------- Stats ---------- */
.stats{display:flex;justify-content:center;gap:14px;margin-top:10px;animation:rise 1s cubic-bezier(.2,.8,.2,1) .5s both}
.stat{display:flex;align-items:center;gap:14px;padding:14px 24px 14px 16px;border-radius:20px;background:rgba(6,16,28,.55);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .25s,border-color .25s,box-shadow .25s}
.stat:hover{transform:translateY(-3px);border-color:rgba(111,208,255,.5);box-shadow:0 14px 40px rgba(0,129,204,.25)}
.stat-ico{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:13px;color:var(--ice);background:linear-gradient(180deg,rgba(46,162,234,.28),rgba(0,129,204,.1));border:1px solid rgba(111,208,255,.2)}
.stat-ico svg{width:22px;height:22px}
.stat strong{display:block;font:800 1.35rem/1.1 var(--font-head);font-variant-numeric:tabular-nums}
.stat strong+span{font-size:.83rem;color:var(--muted)}
.legal{margin-top:18px;max-width:62ch;text-align:center;font-size:.7rem;color:rgba(190,210,225,.75);text-shadow:0 1px 8px rgba(0,0,0,.85)}

/* ---------- Responsive ---------- */
@media (max-width:640px){
  :root{--tilt:.5}
  .hero{padding-top:84px}
  .ip-inner{flex-direction:column;align-items:stretch;gap:16px;padding:22px 18px 18px;text-align:center}
  .ip-value{justify-content:center;font-size:clamp(1.5rem,7.5vw,1.9rem)}
  .copy{width:100%}
  .copy span{min-width:0;text-align:center}
  .stats{flex-direction:column;width:min(100%,340px)}
  .link{padding:10px 14px}
}
@media (max-width:470px){
  .brand-text{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .ip-card{transform:none}
}
</style>
</head>
<body>

<!-- ============ BACKGROUND ============ -->
<div class="bg" aria-hidden="true">
  <!-- Looping trailer. Change videoId in CONFIG at the bottom of this file. -->
  <div class="video-bg" id="video-bg"><div id="bg-video"></div></div>
  <div class="grade"></div>
  <div class="spot"></div>
  <canvas id="fx"></canvas>
  <div class="vignette"></div>
</div>

<!-- ============ NAV: only Home and Discord ============ -->
<header class="nav">
  <a href="#home" class="brand" aria-label="MVP SMP home">
    <span class="logo" role="img" aria-label="MVP logo"></span>
    <span class="brand-text">MVP SMP</span>
  </a>
  <nav class="menu" aria-label="Main navigation">
    <a href="#home" class="link active">Home</a>
    <a href="store/" class="link">Store</a>
    <a href="https://discord.gg/CWTBxgBdr" class="link link-discord" data-discord target="_blank" rel="noopener noreferrer">
      <i class="dc" aria-hidden="true"></i>
      Discord
    </a>
  </nav>
</header>

<main class="hero" id="home">
  <!-- Center: only the server IP and the Copy button -->
  <div class="center">
    <div class="ip-card" id="card">
      <span class="glow" aria-hidden="true"></span>
      <span class="ring" aria-hidden="true"></span>
      <div class="ip-inner">
        <span class="ip-value" id="ip" title="Click to copy"><span data-ip>play.mvpsmp.net</span></span>
        <button class="copy" id="copy-ip" type="button" aria-label="Copy server IP">
          <svg class="ic-copy" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M8 8h11v13H8zM5 16H4V3h11v2"/></svg>
          <svg class="ic-check" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          <span id="copy-label">Copy IP</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Achievements -->
  <ul class="stats" aria-label="Achievements">
    <li class="stat">
      <div class="stat-ico"><svg viewBox="0 0 28 28" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10" cy="9" r="4"/><path d="M3 24c0-5 3-8 7-8s7 3 7 8"/><circle cx="20" cy="10" r="3"/><path d="M19 17c4 0 6 3 6 7"/></g></svg></div>
      <div><strong><span data-count="60">60</span>+ players</strong><span>have already joined MVP</span></div>
    </li>
    <li class="stat">
      <div class="stat-ico"><svg viewBox="0 0 28 28" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="14" r="11"/><path d="M14 7v7l5 3"/></g></svg></div>
      <div><strong><span data-count="3">3</span> years</strong><span>of experience</span></div>
    </li>
  </ul>
  <p class="legal">MVP SMP is not an official Minecraft product and is not approved by or associated with Mojang or Microsoft.</p>
</main>

<script>
/* ==========================================================
   EDIT THIS BLOCK
   ========================================================== */
const CONFIG = {
  serverIP: "play.mvpsmp.net",                    // example IP: replace with the real server address
  discordUrl: "https://discord.gg/CWTBxgBdr",     // Discord invite
  videoId: "_zcJc9evnCw"                          // YouTube trailer (https://youtu.be/_zcJc9evnCw), looped in the background
};

(function () {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const root = document.documentElement;

  /* ---------- Apply config ---------- */
  $$("[data-ip]").forEach((e) => (e.textContent = CONFIG.serverIP));
  $$("[data-discord]").forEach((a) => a.setAttribute("href", CONFIG.discordUrl));

  /* Background trailer (the main feature): YouTube IFrame API, muted, looped by hand.
     No "playlist" parameter on the player (it adds prev/next arrows); the video is shown only while it is really playing,
     so the YouTube player UI never appears. If the API cannot load, a plain embed is used instead. */
  const vbg = $("#video-bg");
  const saveData = navigator.connection && navigator.connection.saveData;
  if (!reduceMotion && !saveData && CONFIG.videoId) {
    let player, timer, started = false, fellBack = false, kicks = 0;
    const show = (on) => vbg.classList.toggle("ready", on);
    const nudge = () => {
      try { if (player && player.getPlayerState && player.getPlayerState() !== 1) player.playVideo(); } catch (e) {}
    };
    const watchLoop = () => {
      clearInterval(timer);
      timer = setInterval(() => {
        try {
          const d = player.getDuration(), t = player.getCurrentTime();
          if (d > 1 && d - t < 0.7) player.seekTo(0, true); // restart just before the end screen
        } catch (e) {}
      }, 250);
    };
    // Last resort when the YouTube API cannot load (ad blocker etc.): plain muted embed
    const fallback = () => {
      if (started || fellBack) return;
      fellBack = true;
      const f = document.createElement("iframe");
      f.title = "MVP SMP trailer (background)";
      f.setAttribute("allow", "autoplay; encrypted-media");
      f.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
      f.tabIndex = -1;
      f.addEventListener("load", () => setTimeout(() => show(true), 1500));
      f.src = "https://www.youtube-nocookie.com/embed/" + CONFIG.videoId + "?" + new URLSearchParams({
        autoplay: 1, mute: 1, loop: 1, playlist: CONFIG.videoId, controls: 0, modestbranding: 1,
        playsinline: 1, rel: 0, iv_load_policy: 3, disablekb: 1, fs: 0
      }).toString();
      vbg.appendChild(f);
    };
    window.onYouTubeIframeAPIReady = () => {
      const vars = {
        autoplay: 1, mute: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3,
        modestbranding: 1, playsinline: 1, rel: 0, cc_load_policy: 0
      };
      if (location.protocol.indexOf("http") === 0) vars.origin = location.origin;
      player = new YT.Player("bg-video", {
        host: "https://www.youtube-nocookie.com",
        videoId: CONFIG.videoId,
        playerVars: vars,
        events: {
          onReady: (e) => { e.target.mute(); e.target.playVideo(); },
          onStateChange: (e) => {
            const S = YT.PlayerState;
            if (e.data === S.PLAYING) { started = true; show(true); watchLoop(); }
            else if (e.data !== S.BUFFERING) {
              show(false); clearInterval(timer);
              if (e.data === S.ENDED) e.target.seekTo(0, true);
              e.target.playVideo();
            }
          },
          onError: () => show(false)
        }
      });
    };
    const api = document.createElement("script");
    api.src = "https://www.youtube.com/iframe_api";
    api.async = true;
    api.onerror = fallback;
    document.head.appendChild(api);
    setTimeout(() => { if (!(window.YT && window.YT.Player)) fallback(); }, 6000);
    // Autoplay can be held back (strict browser settings, battery saver): retry, and again on the first touch, click or key
    const kick = setInterval(() => { if (started || ++kicks > 6) clearInterval(kick); else nudge(); }, 2000);
    ["pointerdown", "touchstart", "keydown", "wheel"].forEach((ev) => window.addEventListener(ev, nudge, { passive: true }));
    document.addEventListener("visibilitychange", () => { if (!document.hidden) nudge(); });
  }

  /* ---------- Copy IP (button or click on the IP) with a pixel burst ---------- */
  const btn = $("#copy-ip"), label = $("#copy-label"), ipEl = $("#ip");
  async function copyText(t) {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return; }
    const ta = document.createElement("textarea");
    ta.value = t; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    if (!ok) throw new Error("copy failed");
  }
  function burst() {
    if (reduceMotion || !btn.animate) return;
    const r = btn.getBoundingClientRect();
    const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
    const colors = ["#ffffff", "#6fd0ff", "#2ea2ea", "#0081cc"];
    for (let i = 0; i < 18; i++) {
      const s = document.createElement("i");
      const size = 5 + Math.round(Math.random() * 6);
      s.className = "px";
      s.style.cssText = "width:" + size + "px;height:" + size + "px;background:" + colors[i % colors.length] + ";box-shadow:0 0 8px " + colors[(i + 1) % colors.length];
      document.body.appendChild(s);
      const ang = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 90;
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist + 40;
      const a = s.animate([
        { transform: "translate(" + ox + "px," + oy + "px) scale(1) rotate(0deg)", opacity: 1 },
        { transform: "translate(" + (ox + dx) + "px," + (oy + dy) + "px) scale(.25) rotate(" + (Math.random() * 360 - 180).toFixed(0) + "deg)", opacity: 0 }
      ], { duration: 650 + Math.random() * 450, easing: "cubic-bezier(.15,.7,.3,1)" });
      a.onfinish = () => s.remove();
    }
  }
  let resetT;
  async function doCopy() {
    clearTimeout(resetT);
    try {
      await copyText(CONFIG.serverIP);
      btn.classList.add("done");
      label.textContent = "Copied!";
      burst();
    } catch (e) {
      const range = document.createRange();
      range.selectNodeContents($("[data-ip]"));
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
      label.textContent = "Press Ctrl+C";
    }
    resetT = setTimeout(() => { btn.classList.remove("done"); label.textContent = "Copy IP"; }, 1900);
  }
  btn.addEventListener("click", doCopy);
  ipEl.addEventListener("click", doCopy);

  /* ---------- Count-up for the achievements ---------- */
  if (!reduceMotion) {
    $$("[data-count]").forEach((el) => {
      const to = +el.getAttribute("data-count");
      const start = performance.now() + 700, dur = 1500;
      el.textContent = "0";
      (function step(now) {
        const k = Math.min(Math.max((now - start) / dur, 0), 1);
        el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(step);
      })(performance.now());
    });
  }


  /* ---------- Extras: time-of-day tint, pixel cursor trail, logo easter egg ---------- */
  (function () {
    const h = new Date().getHours();
    const tod = document.createElement("div");
    tod.className = "tod"; tod.setAttribute("aria-hidden", "true");
    // night = deeper blue, evening = soft violet, day = untouched
    if (h >= 22 || h < 6) { tod.style.background = "rgba(2,10,40,.32)"; tod.style.opacity = "1"; }
    else if (h >= 18) { tod.style.background = "rgba(60,30,120,.14)"; tod.style.opacity = "1"; }
    document.body.appendChild(tod);

    if (reduceMotion || !window.matchMedia("(pointer: fine)").matches) return;

    const N = 7, dots = [], pos = [];
    for (let i = 0; i < N; i++) {
      const d = document.createElement("i");
      d.className = "trail"; d.setAttribute("aria-hidden", "true");
      document.body.appendChild(d); dots.push(d); pos.push({ x: -50, y: -50 });
    }
    let mx = -50, my = -50, on = false;
    window.addEventListener("pointermove", (e) => { mx = e.clientX; my = e.clientY; on = true; }, { passive: true });
    document.documentElement.addEventListener("pointerleave", () => { on = false; });
    (function tick() {
      let px = mx, py = my;
      for (let i = 0; i < N; i++) {
        const p = pos[i];
        p.x += (px - p.x) * (0.42 - i * 0.04); p.y += (py - p.y) * (0.42 - i * 0.04);
        const k = 1 - i / N;
        dots[i].style.transform = "translate(" + p.x.toFixed(1) + "px," + p.y.toFixed(1) + "px) scale(" + (0.25 + k * 0.75).toFixed(2) + ")";
        dots[i].style.opacity = on ? (k * 0.55).toFixed(2) : "0";
        px = p.x; py = p.y;
      }
      requestAnimationFrame(tick);
    })();

    // click the logo 5 times: pixel fireworks
    const brand = $(".brand");
    let clicks = 0, ct;
    if (brand) brand.addEventListener("click", () => {
      clearTimeout(ct); ct = setTimeout(() => (clicks = 0), 1200);
      if (++clicks < 5) return;
      clicks = 0;
      const colors = ["#ffffff", "#6fd0ff", "#2ea2ea", "#0081cc", "#dadada"];
      for (let i = 0; i < 46; i++) {
        const s = document.createElement("i");
        const size = 5 + Math.round(Math.random() * 8);
        s.style.cssText = "position:fixed;z-index:70;pointer-events:none;left:0;top:0;width:" + size + "px;height:" + size + "px;background:" + colors[i % colors.length];
        document.body.appendChild(s);
        const ox = innerWidth / 2, oy = innerHeight * 0.45, a = Math.random() * 6.283, dist = 120 + Math.random() * Math.min(innerWidth, 700) * 0.45;
        s.animate([
          { transform: "translate(" + ox + "px," + oy + "px) scale(1)", opacity: 1 },
          { transform: "translate(" + (ox + Math.cos(a) * dist) + "px," + (oy + Math.sin(a) * dist + 120) + "px) scale(.2) rotate(" + (Math.random() * 540 - 270).toFixed(0) + "deg)", opacity: 0 }
        ], { duration: 1100 + Math.random() * 700, easing: "cubic-bezier(.1,.7,.3,1)" }).onfinish = () => s.remove();
      }
    });
  })();

  /* ---------- Motion: smooth pointer parallax (tilt + spotlight) and floating pixel particles ---------- */
  if (reduceMotion) return;
  const cv = $("#fx"), ctx = cv.getContext("2d");
  let W = 0, H = 0, parts = [];
  const palette = ["255,255,255", "111,208,255", "46,162,234"];
  const spawn = (init) => {
    const z = Math.random();
    return {
      x: Math.random() * W, y: init ? Math.random() * H : H + 20, z,
      s: 3 + Math.round(z * 7), v: 10 + z * 34, a: 0.14 + z * 0.34,
      c: palette[(Math.random() * palette.length) | 0], ph: Math.random() * 6.28, sw: 6 + Math.random() * 16
    };
  };
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = W < 640 ? 10 : 18;
    while (parts.length < n) parts.push(spawn(true));
    parts.length = n;
  }
  resize();
  window.addEventListener("resize", resize);

  let tx = 0, ty = 0, cx = 0, cy = 0, active = false, last = performance.now();
  window.addEventListener("pointermove", (e) => {
    if (e.pointerType === "touch") return;
    active = true;
    tx = (e.clientX / window.innerWidth) * 2 - 1;
    ty = (e.clientY / window.innerHeight) * 2 - 1;
  }, { passive: true });
  document.documentElement.addEventListener("pointerleave", () => { active = false; });

  function frame(now) {
    const dt = Math.min(now - last, 50); last = now;
    if (!active) { tx = Math.sin(now / 3300) * 0.35; ty = Math.cos(now / 4200) * 0.25; } // gentle idle sway (also on phones)
    const k = Math.min(1, dt / 130);
    cx += (tx - cx) * k; cy += (ty - cy) * k;
    root.style.setProperty("--px", cx.toFixed(4));
    root.style.setProperty("--py", cy.toFixed(4));

    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      p.y -= p.v * dt / 1000;
      if (p.y < -20) { parts[i] = spawn(false); continue; }
      const x = Math.round(p.x + Math.sin(now / 1000 + p.ph) * p.sw + cx * p.z * 46);
      const y = Math.round(p.y + cy * p.z * 28);
      ctx.fillStyle = "rgba(" + p.c + "," + (p.a * 0.18).toFixed(3) + ")";
      ctx.fillRect(x - 3, y - 3, p.s + 6, p.s + 6);          // soft halo
      ctx.fillStyle = "rgba(" + p.c + "," + p.a.toFixed(3) + ")";
      ctx.fillRect(x, y, p.s, p.s);                           // the pixel
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
