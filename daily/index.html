<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily reward | MVP</title>
<meta name="theme-color" content="#03080f">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link href="../fonts/fonts.css" rel="stylesheet">
<style>
:root{--bl:#0081cc;--bl2:#22a6f2;--gold:#ffcf3a;--gold2:#ff9d1c;--font-head:"Montserrat","Inter",system-ui,sans-serif;--font-body:"Inter",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px 16px;color:#fff;font:500 1rem/1.4 var(--font-body);background:#03080f;overflow-x:hidden;position:relative}
body:before{content:"";position:fixed;inset:-20%;z-index:0;background:radial-gradient(40% 35% at 20% 15%,rgba(34,166,242,.35),transparent 70%),radial-gradient(45% 40% at 85% 80%,rgba(255,170,40,.18),transparent 70%),radial-gradient(60% 50% at 50% 50%,#082a4a,transparent 80%);animation:bg 14s ease-in-out infinite alternate}
@keyframes bg{to{transform:translate3d(3%,2%,0) scale(1.06)}}
.c{position:relative;z-index:1;width:100%;max-width:460px;padding:26px 22px 22px;border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.brand{font:800 .8rem var(--font-head);letter-spacing:.18em;opacity:.7}
.streak{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);font:700 .8rem var(--font-head)}
.streak svg{width:15px;height:15px}
h1{margin:10px 0 0;font:800 1.7rem var(--font-head);letter-spacing:-.01em;text-align:center}
.hero{position:relative;display:flex;flex-direction:column;align-items:center;margin:14px 0 6px}
.ring{position:relative;width:176px;height:176px}
.ring svg.r{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:rgba(255,255,255,.1)}
.ring .pr{stroke:url(#g1);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.coin{position:absolute;inset:26px;display:flex;align-items:center;justify-content:center}
.coin svg{width:100%;height:100%;filter:drop-shadow(0 8px 18px rgba(255,170,30,.45))}
.ready .coin svg{animation:fl 2.6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px) rotate(-3deg)}}
.wait .coin svg{filter:grayscale(.85) brightness(.8)}
.amt{font:800 2.3rem var(--font-head);margin-top:12px;line-height:1}
.amt small{font:700 .9rem var(--font-head);opacity:.7;margin-left:6px}
.sub{margin:8px 0 0;text-align:center;opacity:.85;min-height:1.4em}
.track{position:relative;display:flex;gap:6px;margin:22px 0 18px}
.day{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 8px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid transparent;font:700 .72rem var(--font-head)}
.day i{font-style:normal;opacity:.55;font-size:.62rem;letter-spacing:.06em}
.day svg{width:18px;height:18px}
.day.done{background:rgba(34,166,242,.22);border-color:rgba(34,166,242,.35)}
.day.today{background:linear-gradient(180deg,rgba(255,207,58,.25),rgba(255,157,28,.12));border-color:var(--gold);box-shadow:0 0 18px rgba(255,190,50,.35)}
.btn{position:relative;overflow:hidden;display:flex;width:100%;align-items:center;justify-content:center;gap:8px;padding:16px;border-radius:999px;border:0;cursor:pointer;color:#fff;font:800 1.05rem var(--font-head);background:linear-gradient(180deg,var(--bl2),var(--bl));box-shadow:0 10px 28px rgba(0,129,204,.45);text-decoration:none;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{background:rgba(255,255,255,.1);box-shadow:none;color:rgba(255,255,255,.55);cursor:default}
.btn.gold{background:linear-gradient(180deg,#ffd75a,var(--gold2));color:#2a1a00;box-shadow:0 10px 28px rgba(255,157,28,.45)}
.btn.gold:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:sh 2.8s infinite}
@keyframes sh{to{left:130%}}
.btn.g{background:rgba(255,255,255,.1);box-shadow:none;margin-top:10px;font-size:.95rem}
.foot{margin-top:14px;text-align:center;font-size:.78rem;opacity:.55}
.foot a{color:inherit}
#cf{position:fixed;inset:0;z-index:5;pointer-events:none;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd75a"/><stop offset="1" stop-color="#ff9d1c"/></linearGradient>
<linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset=".55" stop-color="#ffb62e"/><stop offset="1" stop-color="#e07d00"/></linearGradient>
<symbol id="coin" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="url(#cg)"/><circle cx="32" cy="32" r="22.5" fill="none" stroke="rgba(120,60,0,.45)" stroke-width="2.5"/><path d="M20 42V22l12 13 12-13v20" fill="none" stroke="#7a3d00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M13 22A22 22 0 0 1 30 10" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="3" stroke-linecap="round"/></symbol>
<symbol id="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#7fd4ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="fire" viewBox="0 0 24 24"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.2 2-4.2.2 1.4.9 2.2 1.8 2.4C10.2 8.2 10.6 4.8 12 2z" fill="#ffb62e"/></symbol>
</defs></svg>
<div class="c" id="card">
  <div class="top"><div class="brand">MVP</div><div class="streak" id="st" style="visibility:hidden"><svg><use href="#fire"/></svg><span id="stn">0</span></div></div>
  <h1>Daily reward</h1>
  <div class="hero wait" id="hero">
    <div class="ring">
      <svg class="r" viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="46" fill="none" stroke-width="5"/><circle class="pr" id="pr" cx="50" cy="50" r="46" fill="none" stroke-width="5" stroke-dasharray="289" stroke-dashoffset="289"/></svg>
      <div class="coin"><svg><use href="#coin"/></svg></div>
    </div>
    <div class="amt" id="amt"></div>
    <p class="sub" id="s">Loading...</p>
  </div>
  <div class="track" id="days"></div>
  <button class="btn" id="go" type="button" disabled>Claim</button>
  <a class="btn g" id="alt" href="/card/" style="display:none">Open my profile</a>
  <div class="foot">Coins arrive in the game when you are online.</div>
</div>
<script>
(function () {
  var API = "https://mvp-news-api.mvp-shop.workers.dev", KEY = "mvp_card_token", CIRC = 289;
  var $ = function (i) { return document.getElementById(i); };
  var s = $("s"), days = $("days"), go = $("go"), alt = $("alt"), hero = $("hero"), pr = $("pr"), amt = $("amt"), timer = null, total = 86400000;
  function tok() { var t = ""; try { t = localStorage.getItem(KEY) || ""; } catch (e) {} if (!t) { var m = document.cookie.match(new RegExp("(?:^|; )" + KEY + "=([^;]+)")); if (m) t = m[1]; } return t; }
  function call(m, p) { return fetch(API + p, { method: m, headers: { Authorization: "Bearer " + tok(), "Content-Type": "application/json" }, body: m === "POST" ? "{}" : undefined }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); }); }
  function left(ms) { var t = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), x = t % 60; return (h ? h + "h " : "") + (h || m ? m + "m " : "") + x + "s"; }
  function need(msg, label, href) { s.textContent = msg; amt.textContent = ""; go.style.display = "none"; alt.textContent = label; alt.href = href || "/card/"; alt.style.display = "flex"; hero.className = "hero wait"; }
  function ring(f) { pr.style.strokeDashoffset = String(CIRC * (1 - Math.max(0, Math.min(1, f)))); }
  function paint(st) {
    days.textContent = "";
    $("st").style.visibility = "visible"; $("stn").textContent = st.streak;
    (st.rewards || []).forEach(function (r, i) {
      var c = document.createElement("div"), done = i < st.streak && !(st.ready && i === st.next_streak - 1), today = st.ready && i === st.next_streak - 1;
      c.className = "day" + (done ? " done" : "") + (today ? " today" : "");
      c.innerHTML = '<i>DAY ' + (i + 1) + '</i><svg><use href="#' + (done ? "ck" : "coin") + '"/></svg><span>' + r + '</span>';
      days.appendChild(c);
    });
    if (!st.linked) { need("Link your Minecraft account first. Get the command on your profile and type it in the game.", "Open my profile"); return; }
    var end = Date.now() + st.remaining_ms;
    function tick() {
      var l = end - Date.now();
      if (st.ready || l <= 0) {
        hero.className = "hero ready"; ring(1); amt.innerHTML = "+" + st.reward_now + "<small>coins</small>"; s.textContent = "Your reward is ready!";
        go.className = "btn gold"; go.disabled = false; go.textContent = "Claim reward";
        if (timer) { clearInterval(timer); timer = null; }
      } else {
        hero.className = "hero wait"; ring(1 - l / total); amt.innerHTML = left(l); s.textContent = "until your next reward";
        go.className = "btn"; go.disabled = true; go.textContent = "Come back later";
      }
    }
    if (timer) clearInterval(timer); tick(); if (!st.ready) timer = setInterval(tick, 1000);
  }
  function load() { call("GET", "/api/app/daily").then(function (r) { if (r.ok) paint(r.j); else need("Could not load. Try again later.", "Open my profile"); }).catch(function () { need("Cannot reach the server.", "Open my profile"); }); }
  // confetti of coins
  function burst() {
    if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
    var cv = $("cf"), x = cv.getContext("2d"), W = cv.width = innerWidth, H = cv.height = innerHeight, r = $("hero").getBoundingClientRect(), P = [], cols = ["#ffd75a", "#ff9d1c", "#22a6f2", "#fff"];
    for (var i = 0; i < 70; i++) { var a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 8; P.push({ x: r.left + r.width / 2, y: r.top + 90, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 5, s: 4 + Math.random() * 6, c: cols[i % 4], rot: Math.random() * 6, life: 1 }); }
    (function f() { x.clearRect(0, 0, W, H); var alive = 0; P.forEach(function (p) { p.vy += .28; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.rot += .15; p.life -= .008; if (p.life > 0) { alive++; x.save(); x.globalAlpha = Math.max(0, p.life); x.translate(p.x, p.y); x.rotate(p.rot); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .66); x.restore(); } }); if (alive) requestAnimationFrame(f); else x.clearRect(0, 0, W, H); })();
  }
  go.addEventListener("click", function () {
    go.disabled = true;
    call("POST", "/api/app/daily/claim").then(function (r) {
      if (r.ok) { burst(); hero.className = "hero ready"; amt.innerHTML = "+" + r.j.amount + "<small>coins</small>"; s.textContent = "Claimed! The coins arrive when you are in the game."; go.className = "btn"; go.textContent = "Done"; setTimeout(load, 3500); }
      else if (r.status === 409) { need("Link your Minecraft account first.", "Open my profile"); }
      else load();
    }).catch(function () { s.textContent = "Cannot reach the server."; go.disabled = false; });
  });
  if (!tok()) { need("Log in to your MVP account first, then open this page again.", "Log in", "/card/"); return; }
  load();
})();
</script>
</body>
</html>
