<style>
/* ==========================================================
   MVP SMP: one-page site (single file)
   Brand colors: blue #0081cf, white, light gray #dadada
   ========================================================== */
:root{
  --blue:#0081cf; --blue-light:#38a9f0; --blue-dark:#00629d;
  --white:#fff; --gray:#dadada; --muted:#9db3c7;
  --bg:#040a12; --glass:rgba(6,16,28,.72); --line:rgba(120,190,240,.22);
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-head:"Montserrat","Inter",system-ui,sans-serif;
  --nav-h:68px; --radius:10px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--white);font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
ul{margin:0;padding:0;list-style:none}
p{margin:0}
code{font-family:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--blue-light);outline-offset:3px}
.container{width:min(1160px,100% - 40px);margin-inline:auto}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 26px;font:700 .95rem/1 var(--font-head);letter-spacing:.04em;border:2px solid transparent;border-radius:var(--radius);cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s,border-color .2s}
.btn svg{width:18px;height:18px;flex:none}
.btn-blue{color:var(--white);background:var(--blue);border-color:var(--blue-light);box-shadow:0 8px 28px rgba(0,129,207,.45)}
.btn-blue:hover{transform:translateY(-2px);background:var(--blue-light);box-shadow:0 12px 34px rgba(56,169,240,.55)}
.btn-blue:active{transform:translateY(1px)}
.btn-small{padding:10px 20px;font-size:.88rem}

/* Navigation: Home + Discord only */
.nav{position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:100;background:linear-gradient(180deg,rgba(4,10,18,.85),rgba(4,10,18,0));transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.nav.scrolled{background:rgba(4,10,18,.92);backdrop-filter:blur(10px);border-bottom-color:var(--line)}
.nav-inner{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:inline-flex;align-items:center;gap:12px}
.brand img{height:26px;width:auto}
.brand-text{font:800 1.05rem/1 var(--font-head);letter-spacing:.06em}
.nav-menu{display:flex;align-items:center;gap:8px}
.nav-link{position:relative;padding:10px 14px;font-weight:500;font-size:.95rem;color:var(--gray);transition:color .2s}
.nav-link::after{content:"";position:absolute;left:14px;right:14px;bottom:3px;height:2px;background:var(--blue-light);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav-link:hover,.nav-link.active{color:var(--white)}
.nav-link:hover::after,.nav-link.active::after{transform:scaleX(1)}

/* Hero (looping trailer background) */
.hero{position:relative;min-height:100svh;display:grid;grid-template-rows:1fr auto;padding:var(--nav-h) 0 0;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 30%,#0b3a5e 0%,#061a2c 45%,#040a12 80%)}
.video-bg{position:absolute;inset:0;z-index:-2;overflow:hidden}
.video-bg iframe{position:absolute;top:50%;left:50%;width:max(100vw,177.78svh);height:max(56.25vw,100svh);transform:translate(-50%,-50%) scale(1.12);border:0;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
.video-bg.ready iframe{opacity:1}
.hero-overlay{position:absolute;inset:0;z-index:-1;background:
  radial-gradient(ellipse at 50% 48%,rgba(4,10,18,.55) 0%,rgba(4,10,18,.25) 40%,rgba(4,10,18,.6) 100%),
  linear-gradient(180deg,rgba(0,60,110,.25) 0%,rgba(4,10,18,0) 35%,rgba(4,10,18,.9) 100%)}

.center{display:flex;align-items:center;justify-content:center;padding:24px 0}
.ip-box{display:inline-flex;align-items:center;gap:20px;max-width:100%;padding:12px 12px 12px 28px;background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px rgba(0,129,207,.15)}
.ip-value{font:800 clamp(1.4rem,3.6vw,2.6rem)/1.1 var(--font-head);letter-spacing:.02em;word-break:break-all}
.btn-copy{padding:16px 28px;font-size:1rem}

/* Achievements */
.stats{justify-self:center;display:flex;gap:0;margin:0 20px 22px;background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px)}
.stats li{display:flex;align-items:center;gap:14px;padding:16px 28px}
.stats li+li{border-left:1px solid var(--line)}
.stat-ico{width:32px;height:32px;flex:none;color:var(--blue-light)}
.stats strong{display:block;font:800 1.3rem/1.1 var(--font-head)}
.stats span{font-size:.85rem;color:var(--muted)}

.legal{padding:0 20px 16px;text-align:center;font-size:.7rem;color:rgba(157,179,199,.6)}

.toast{position:fixed;left:50%;bottom:28px;z-index:200;max-width:calc(100% - 32px);padding:14px 22px;background:#0a1a2b;color:var(--white);border:1px solid var(--blue);border-radius:var(--radius);box-shadow:0 10px 40px rgba(0,0,0,.6);font-size:.9rem;transform:translate(-50%,30px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:640px){
  .ip-box{flex-direction:column;align-items:stretch;gap:14px;padding:20px 16px 16px;text-align:center}
  .btn-copy{width:100%}
  .stats{flex-direction:column;width:calc(100% - 40px)}
  .stats li{padding:14px 20px}
  .stats li+li{border-left:0;border-top:1px solid var(--line)}
  .brand-text{font-size:.95rem}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>

  <!-- Center: only the server IP and the Copy button -->

      <button class="btn btn-blue btn-copy" id="copy-ip" type="button">

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ==========================================================
   EDIT THIS BLOCK
   ========================================================== */
const CONFIG = {
  serverIP: "play.mvpsmp.net",                    // example IP: replace with the real server address
  discordUrl: "https://discord.gg/YOUR_INVITE",   // PLACEHOLDER: replace with your Discord invite
  videoId: "_zcJc9evnCw"                          // YouTube trailer (https://youtu.be/_zcJc9evnCw), looped in the background
};

(function () {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Apply config */
  $$("[data-ip]").forEach((e) => (e.textContent = CONFIG.serverIP));
  $$("[data-discord]").forEach((a) => a.setAttribute("href", CONFIG.discordUrl));

  /* Toast */
  const toast = $("#toast");
  let tt;
  function showToast(m) {
    toast.textContent = m;
    toast.classList.add("show");
    clearTimeout(tt);
    tt = setTimeout(() => toast.classList.remove("show"), 2400);
  }

  /* Background trailer loop (muted autoplay; skipped for reduced motion / data saver) */
  const vbg = $("#video-bg"), frame = $("#bg-video");
  const saveData = navigator.connection && navigator.connection.saveData;
  if (!reduceMotion && !saveData && CONFIG.videoId) {
    const p = new URLSearchParams({
      autoplay: 1, mute: 1, loop: 1, playlist: CONFIG.videoId, controls: 0,
      modestbranding: 1, playsinline: 1, rel: 0, iv_load_policy: 3, disablekb: 1, fs: 0
    });
    frame.addEventListener("load", () => setTimeout(() => vbg.classList.add("ready"), 1500));
    frame.src = "https://www.youtube-nocookie.com/embed/" + CONFIG.videoId + "?" + p.toString();
  }

  /* Copy IP */
  async function copyText(t) {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return; }
    const ta = document.createElement("textarea");
    ta.value = t; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    if (!ok) throw new Error("copy failed");
  }
  const btn = $("#copy-ip"), label = $("span", btn), orig = label.textContent;
  btn.addEventListener("click", async () => {
    try {
      await copyText(CONFIG.serverIP);
      label.textContent = "Copied!";
      showToast("Server IP copied to clipboard");
    } catch (e) {
      showToast("Couldn't copy automatically. Please copy the IP manually.");
    }
    setTimeout(() => (label.textContent = orig), 1800);
  });

  /* Discord placeholder guard */
  if (CONFIG.discordUrl.includes("YOUR_INVITE")) {
    $$("[data-discord]").forEach((a) => a.addEventListener("click", (e) => {
      e.preventDefault();
      showToast("Discord invite not set yet. Add it in CONFIG.");
    }));
  }

  /* Nav background on scroll */
  const nav = $("#nav");
  const onScroll = () => nav.classList.toggle("scrolled", window.scrollY > 30);
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
})();
</script>
